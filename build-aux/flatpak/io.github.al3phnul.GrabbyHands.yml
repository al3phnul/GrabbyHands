#
# Flatpak manifest for GrabbyHands.
#
# Build and test locally (nothing is installed):
#   flatpak-builder --force-clean build/flatpak build-aux/flatpak/io.github.al3phnul.GrabbyHands.yml
#   flatpak-builder --run build/flatpak build-aux/flatpak/io.github.al3phnul.GrabbyHands.yml \
#       grabbyhands --version
#
# The GNOME runtime already has Python, PyGObject, pycairo, GTK and libadwaita. Everything
# else GrabbyHands needs is built here from pinned upstream sources (see docs/third-party.md).
app-id: io.github.al3phnul.GrabbyHands
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: grabbyhands
# The bundle contains more than GrabbyHands itself; say so where app stores show the license.
# Each module's license text is installed under /app/share/licenses.
appdata-license: GPL-3.0-or-later AND CC-BY-SA-4.0 AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND MIT AND MIT-CMU AND PSF-2.0

finish-args:
  # Show windows. X11 is only a fallback for sessions without Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU rendering for GTK.
  - --device=dri
  # The one folder GrabbyHands writes to by itself: Pictures/GrabbyHands (auto-save).
  # A different folder picked in Settings, and Save As, go through the file chooser portal.
  - --filesystem=xdg-pictures/GrabbyHands:create
  # Window positions from the "GrabbyHands Window Helper" GNOME Shell extension.
  - --talk-name=io.github.al3phnul.GrabbyHands.Shell
  # Where the bundled Tesseract finds its language data.
  - --env=TESSDATA_PREFIX=/app/share/tessdata
  # Smart Edit only: requests to api.anthropic.com. Nothing goes online unless the person
  # turns Smart Edit on, adds their own API key and presses Send.
  - --share=network
  # Deliberately absent: home or host file access, and session-bus access beyond the
  # helper above. Screenshots, global shortcuts, start at login, notifications, the Trash,
  # "Show in Folder" and the keyring that holds the Smart Edit key all go through XDG
  # portals, which need no extra permission.

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # Build-time only: Pillow's setup.py and the zxing-cpp Python module need pybind11.
  - name: python3-pybind11
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation pybind11
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/33/fd/8762f7ee3e4e4be6d1d846cffb4916dd9bb02b2f800d3603718a0efe494c/pybind11-3.1.0-py3-none-any.whl
        sha256: b8488090f8acffbcb6b5d6a85571a6827a0a2981ffb75e5a0b27b87c4a6b7dd0
    cleanup:
      - '*'

  # Image loading, saving (PNG, JPEG, WebP) and filters.
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --no-deps --no-build-isolation
        --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ce/a4/9cc30690a394a8305e8be4c9036aa16d0dfddadd09079860b582f562496d/pillow-13.0.0.tar.gz
        sha256: cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510

  # QR code and barcode reading (Python module "zxingcpp"). 2.3.0 is the series Debian 13
  # and Ubuntu 26.04 ship and the one GrabbyHands is tested against.
  - name: zxing-cpp
    buildsystem: simple
    build-commands:
      - cmake -S . -B _build -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=${FLATPAK_DEST}
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -DBUILD_SHARED_LIBS=OFF
        -DZXING_READERS=ON
        -DZXING_WRITERS=OLD
        -DZXING_EXAMPLES=OFF
        -DZXING_PYTHON_MODULE=ON
        -DZXING_DEPENDENCIES=LOCAL
        -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"
      - cmake --build _build --target zxingcpp
      - install -Dm755 _build/wrappers/python/zxingcpp*.so
        -t "${FLATPAK_DEST}/lib/python$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')/site-packages/"
      # pybind11 is compiled into the module, so its license ships with it.
      - cp "$(python3 -c 'import pybind11; print(pybind11.__path__[0])')"-*.dist-info/licenses/LICENSE
        LICENSE.pybind11
    license-files:
      - LICENSE
      - LICENSE.pybind11
    sources:
      - type: archive
        url: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v2.3.0.tar.gz
        sha256: 64e4139103fdbc57752698ee15b5f0b0f7af9a0331ecbdc492047e0772c417ba

  # Image library Tesseract is built on. GrabbyHands only feeds it PNG; TIFF stays on
  # because Leptonica's built-in fonts are stored as TIFF data.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
      - -DENABLE_GIF=OFF
      - -DENABLE_WEBP=OFF
      - -DENABLE_OPENJPEG=OFF
    license-files:
      - leptonica-license.txt
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7

  # Text recognition (OCR). GrabbyHands runs the "tesseract" command.
  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DOPENMP_BUILD=OFF
      - -DENABLE_NATIVE=OFF
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_TIFF=ON
      - -DENABLE_CCACHE=OFF
      - -DINSTALL_CONFIGS=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz
        sha256: a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4

  # English language data for Tesseract (the small, fast model).
  - name: tessdata-eng
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata -t ${FLATPAK_DEST}/share/tessdata/
    sources:
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/LICENSE
        sha256: cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30

  # Smart Edit: Anthropic's Python library and what it needs, as pinned wheels (the two
  # compiled ones for x86_64). License texts ship in each package's .dist-info folder.
  - name: python3-anthropic
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation anthropic
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/99/91/8acff4f5e50511b911bbccb72b8628a49c68ce14148cd9f6431094859a90/annotated_types-0.8.0-py3-none-any.whl
        sha256: f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
      - type: file
        url: https://files.pythonhosted.org/packages/96/8e/f8ef271dcbe3b187879b660c129ee36ef655c7b878f6878460891d9b2a26/anthropic-2.8.0-py3-none-any.whl
        sha256: 76ad332e2d500fc54d0112cf100544ad1a7605e71e092b98d9eb664d2b66e283
      - type: file
        url: https://files.pythonhosted.org/packages/a9/16/7757fb84c819accc7d7e9af5291b261e4abb8627ee040f99e7d35ef2457a/anyio-4.16.0-py3-none-any.whl
        sha256: c66ae634e0b8228396b801741beb3294326d4b6102f7bba4041c0dfb58c29026
      - type: file
        url: https://files.pythonhosted.org/packages/a7/5f/ed01f9a3cdffbd5a008556fc7b2a08ddb1cc6ace7effa7340604b1d16699/docstring_parser-0.18.0-py3-none-any.whl
        sha256: b3fcbed555c47d8479be0796ef7e19c2670d428d72e96da63f3a40122860374b
      - type: file
        url: https://files.pythonhosted.org/packages/04/4b/29cac41a4d98d144bf5f6d33995617b185d14b22401f75ca86f384e87ff1/h11-0.16.0-py3-none-any.whl
        sha256: 63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
      - type: file
        url: https://files.pythonhosted.org/packages/af/c2/ce417c397afa5181f0e3c6ff01a4d01639414e1adef08730d97571297151/httpcore2-2.16.0-py3-none-any.whl
        sha256: 5c4358319f2602d984ad93182c9fee5160f22e9da7babdda870a5e7c4e2dc34f
      - type: file
        url: https://files.pythonhosted.org/packages/7b/3d/2e4bc4fd1ef9770871669adb348d612a6e4786b303a23f9935b81c48dd60/httpx2-2.16.0-py3-none-any.whl
        sha256: fd2c5d7909e8d86fe92d53020c310ca0e4e431b838c207c5754b9bbf0308d49a
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/30/f1/75de49da39833a8be13b47468b99876c1f4a96b301c6a3fa3ad6a7d87e7d/jiter-0.19.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 3b27d6bec319dc17cdced13e495f90ce066676ca296fc56f2dd2128f6a7599ed
      - type: file
