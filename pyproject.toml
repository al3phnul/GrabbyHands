# Tooling config only. GrabbyHands is built and installed with Meson, not pip.

[tool.ruff]
line-length = 100
target-version = "py311"
# `_` is the gettext function installed into builtins by the launcher.
builtins = ["_"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
